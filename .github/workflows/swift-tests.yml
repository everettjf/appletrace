name: Swift Tests

on:
  push:
  pull_request:

jobs:
  swift-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run package tests (macros, runtime, decoder)
        run: swift test
        env:
          APPLETRACE_DATA_DIR: ${{ runner.temp }}/appletracedata-tests

      - name: Smoke-test the SwiftTrace bridge (executable)
        run: swift run AppleTraceAutoExample
        env:
          APPLETRACE_DATA_DIR: ${{ runner.temp }}/appletracedata-example

      - name: Smoke-test the appletrace CLI
        run: |
          swift run appletrace version
          swift run appletrace merge sampledata -o "${RUNNER_TEMP}/sample.json"
          swift run appletrace summary sampledata

      - name: Test the summary / diff performance gates
        run: ./scripts/test_ci_gates.sh

      - name: Build both routes for the iOS Simulator
        run: |
          xcodebuild -scheme AppleTrace \
            -destination 'generic/platform=iOS Simulator' build
          xcodebuild -scheme AppleTraceAuto \
            -destination 'generic/platform=iOS Simulator' build

      - name: Build the AppleTrace route for an iOS device (arm64 hook)
        run: |
          xcodebuild -scheme AppleTrace \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build the Swift demo app for the iOS Simulator
        # Note: -destination only, no -sdk (that would force the macro plugin
        # onto the simulator SDK instead of the macOS host).
        run: |
          xcodebuild \
            -project sample/AppleTraceSwiftDemo/AppleTraceSwiftDemo.xcodeproj \
            -scheme AppleTraceSwiftDemo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  hook-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: objc_msgSend hook on the arm64 host (incl. late dlopen)
        run: ./scripts/test_hook_host.sh

  jailbreak-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: brew install ldid xz
      - name: Build rootless + roothide loader packages
        run: ./scripts/build_jailbreak_packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appletrace-loader-debs
          path: build/jailbreak/*.deb
